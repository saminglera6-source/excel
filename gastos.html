<div id="view-gastos" class="view">
  <style>
    /* Mismo lenguaje visual del asistente de Compras/Ventas/etc.
       (compras.html define crearWizard() — se incluye antes que esta
       vista, ver index.html). Gastos quedó SOLO para cargar gastos (el
       Cambio de moneda y el Ajuste de caja se movieron a Caja, como
       modales instantáneos) — antes las tres cosas convivían en pestañas
       de una misma pantalla, y los empleados reportaron que resultaba
       muy complicado cargar un gasto simple en medio de eso. */
    #view-gastos {
      --gpw-texto: #191B2E; --gpw-texto-sua: #767A94; --gpw-borde: rgba(24,27,55,.08);
      --gpw-fondo-campo: #F4F5FA; --gpw-indigo: #4F46E5; --gpw-violeta: #7C6FF0; --gpw-indigo-osc: #3730A3;
      --gpw-verde: #0F9D58; --gpw-radio: 20px;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #view-gastos > .panel {
      max-width: 560px; margin: 0 auto; padding: 4px 40px 40px; position: relative; overflow: hidden;
      border: none; border-radius: 26px;
      box-shadow: 0 1px 2px rgba(24,27,55,.05), 0 2px 8px rgba(24,27,55,.06), 0 28px 60px rgba(24,27,55,.14);
    }
    #view-gastos > .panel::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
      background: linear-gradient(90deg, var(--gpw-indigo), var(--gpw-violeta), #A78BFA);
    }
    #view-gastos > .panel > h3 {
      font-family: "Manrope", "Inter", sans-serif; font-size: 21px; font-weight: 800; letter-spacing: -.4px;
      color: var(--gpw-texto); text-align: center; margin: 40px 0 22px;
    }
    #view-gastos .gp-wizard-eyebrow {
      font-size: 11px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase;
      background: linear-gradient(90deg, var(--gpw-indigo), var(--gpw-violeta));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-align: center; margin: 26px 0 9px;
    }
    #view-gastos .gp-wizard-progreso {
      height: 5px; border-radius: 100px; background: var(--gpw-fondo-campo); overflow: hidden; margin-bottom: 16px;
      box-shadow: inset 0 1px 2px rgba(24,27,55,.06);
    }
    #view-gastos .gp-wizard-progreso-fill {
      height: 100%; border-radius: 100px; background: linear-gradient(90deg, var(--gpw-indigo), var(--gpw-violeta));
      box-shadow: 0 0 10px rgba(79,70,229,.5);
      transition: width .4s cubic-bezier(.4,0,.2,1);
    }
    #view-gastos .gp-wizard-dots { display: flex; justify-content: center; gap: 7px; margin-bottom: 8px; }
    #view-gastos .gp-wizard-dot {
      width: 7px; height: 7px; border-radius: 100px; background: var(--gpw-borde); cursor: pointer;
      transition: all .25s cubic-bezier(.4,0,.2,1);
    }
    #view-gastos .gp-wizard-dot:hover { background: #C2C4DB; }
    #view-gastos .gp-wizard-dot.hecho { background: var(--gpw-verde); }
    #view-gastos .gp-wizard-dot.activo { width: 22px; background: linear-gradient(90deg, var(--gpw-indigo), var(--gpw-violeta)); }
    #view-gastos .paso {
      background: transparent; border: none; padding: 0; margin-top: 26px; box-shadow: none;
      animation: gp-wizard-fade .3s cubic-bezier(.4,0,.2,1);
    }
    @keyframes gp-wizard-fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    #view-gastos .paso-titulo {
      font-family: "Manrope", "Inter", sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -.3px;
      color: var(--gpw-texto); justify-content: center; text-align: center; margin-bottom: 6px;
    }
    #view-gastos .paso-num { display: none; }
    #view-gastos .paso-titulo::after {
      content: ""; display: block; width: 40px; height: 3px; margin: 12px auto 0; border-radius: 100px;
      background: linear-gradient(90deg, var(--gpw-indigo), var(--gpw-violeta));
    }
    #view-gastos label { font-size: 12.5px; font-weight: 700; color: var(--gpw-texto-sua); margin-top: 16px; letter-spacing: .1px; }
    #view-gastos .paso > label:first-child,
    #view-gastos .paso > .fila2:first-child label { margin-top: 0; }
    #view-gastos input, #view-gastos select, #view-gastos textarea {
      font-size: 15px; padding: 12px 14px; border: 1.5px solid transparent; border-radius: 13px;
      background: var(--gpw-fondo-campo); color: var(--gpw-texto); font-family: inherit; font-weight: 500;
      transition: background .15s, box-shadow .15s, border-color .15s;
    }
    #view-gastos input::placeholder, #view-gastos textarea::placeholder { color: #A6A9C2; font-weight: 400; }
    #view-gastos input:focus, #view-gastos select:focus, #view-gastos textarea:focus {
      background: #fff; border-color: var(--gpw-indigo); box-shadow: 0 0 0 4px rgba(79,70,229,.13); outline: none;
    }
    #view-gastos .req { color: #E11D48; }
    #view-gastos .hint { color: var(--gpw-texto-sua); font-size: 12px; line-height: 1.55; margin-top: 6px; }
    #view-gastos .total { background: #E7F8EF; border: none; border-radius: 15px; color: #0D7A3B; font-weight: 700; }
    #view-gastos .btn {
      font-size: 15px; font-weight: 700; padding: 13px 20px; border-radius: 100px;
      background: linear-gradient(135deg, var(--gpw-indigo), var(--gpw-violeta)); letter-spacing: -.1px;
      box-shadow: 0 4px 14px rgba(79,70,229,.32);
      transition: transform .12s ease, box-shadow .15s ease, opacity .15s ease;
    }
    #view-gastos .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(79,70,229,.4); }
    #view-gastos .btn:active { transform: scale(.97) translateY(0); box-shadow: 0 2px 8px rgba(79,70,229,.3); }
    #view-gastos .gp-wizard-nav { display: flex; align-items: center; gap: 14px; margin-top: 32px; }
    #view-gastos .gp-wizard-nav .btn { width: auto; flex: 0 0 auto; padding: 13px 28px; }
    #view-gastos .gp-wizard-nav .gp-wizard-atras {
      background: transparent; color: var(--gpw-indigo); padding: 13px 10px; box-shadow: none; font-weight: 700;
    }
    #view-gastos .gp-wizard-nav .gp-wizard-atras:hover { background: var(--gpw-fondo-campo); transform: none; box-shadow: none; }
    #view-gastos .gp-wizard-nav .gp-wizard-siguiente { margin-left: auto; }
    #view-gastos .gp-wizard-paso-final > .btn {
      width: 100%; margin-top: 18px; padding: 16px; font-size: 16px;
      background: linear-gradient(135deg, var(--gpw-verde), #17B26A); box-shadow: 0 6px 18px rgba(15,157,88,.32);
    }
    #view-gastos .gp-wizard-paso-final > .btn:hover { box-shadow: 0 8px 22px rgba(15,157,88,.4); }
  </style>
  <div class="panel">
    <h3>💸 Registrar Gasto</h3>

    <form id="gastos_form" onsubmit="return false;">

    <div class="paso">
      <p class="paso-titulo"><span class="paso-num">1</span> ¿Quién y cuándo?</p>
      <label>Operador: <span class="req">*</span></label>
      <select id="g_operador" required>
        <option value="" disabled selected>Seleccionar...</option>
        <option>Martin</option><option>Maca</option><option>Sam</option><option>Eva</option><option>Buda</option>
      </select>
      <label>Fecha:</label>
      <input type="date" id="g_fecha"/>
    </div>

    <div class="paso">
      <p class="paso-titulo"><span class="paso-num">2</span> ¿Qué gasto es?</p>
      <label>Categoría:</label>
      <select id="g_cat">
        <option>Alquiler</option><option>Sueldos</option><option>Servicios</option>
        <option>Repuestos</option><option>Publicidad</option><option>Transporte</option>
        <option>Comida</option><option>Impuestos</option><option>Mantenimiento</option>
        <option>Otros</option>
      </select>

      <label>Descripción: <span class="req">*</span></label>
      <input type="text" id="g_desc" placeholder="Detalle del gasto"/>
    </div>

    <div class="paso">
      <p class="paso-titulo"><span class="paso-num">3</span> ¿Cuánto y cómo se pagó?</p>

      <div class="fila2">
        <div>
          <label>Monto efectivo ($):</label>
          <input type="text" inputmode="numeric" id="g_efec" value="" placeholder="$0" oninput="formatearInputMoneda(this); gastosCalcTotal()"/>
        </div>
        <div>
          <label>Monto transferencia ($):</label>
          <input type="text" inputmode="numeric" id="g_transf" value="" placeholder="$0" oninput="formatearInputMoneda(this); gastosCalcTotal()"/>
        </div>
      </div>

      <label>Monto USD (dólares):</label>
      <input type="number" id="g_usd" value="" placeholder="0" min="0" oninput="gastosCalcTotal()"/>
      <div class="hint" id="g_cotizDiv"></div>

      <div class="total" id="g_totalDiv">Total pagado: $0</div>
    </div>

    <div class="paso paso-opcional">
      <p class="paso-titulo"><span class="paso-num">4</span> Datos adicionales (opcional)</p>
      <div class="fila2">
        <div>
          <label>Responsable:</label>
          <input type="text" id="g_resp" value="Martin"/>
        </div>
        <div>
          <label>N° Comprobante (opcional):</label>
          <input type="text" id="g_comp" placeholder="Ej: FC-0001, dejalo vacío si no hay factura"/>
        </div>
      </div>
      <div class="hint">"Responsable" es quién autorizó o hizo el gasto — puede ser distinto de "Operador" (arriba), que es quien está cargando esta pantalla ahora mismo.</div>

      <label>Observaciones:</label>
      <input type="text" id="g_obs" placeholder="Opcional"/>

      <button type="button" class="btn" onclick="gastosEnviar()">✅ Registrar gasto</button>
    </div>
    </form>
  </div>
</div>

<script>
  document.getElementById("g_fecha").value = new Date().toISOString().split("T")[0];

  var _gastosCotizacion = 0;
  google.script.run.withSuccessHandler(function(cot){
    _gastosCotizacion = cot.venta;
    document.getElementById("g_cotizDiv").textContent = "Cotización USD oficial: " + fmtP(cot.venta);
    gastosCalcTotal();
  }).obtenerCotizacionUSD();

  // Asistente paso a paso, mismo patrón que el resto de la app
  // (compras.html define crearWizard() — se incluye antes que esta
  // vista, ver index.html).
  var _wizardGastos = crearWizard(
    Array.prototype.slice.call(document.querySelectorAll("#gastos_form .paso")),
    { validar: function(i){
        if (i === 0 && !document.getElementById("g_operador").value) return { ok:false, msg:"Seleccioná el operador." };
        if (i === 1 && !document.getElementById("g_desc").value.trim()) return { ok:false, msg:"Ingresá una descripción." };
        if (i === 2 && gastosCalcTotal() <= 0) return { ok:false, msg:"Ingresá cuánto se pagó (efectivo, transferencia o USD)." };
        return { ok:true };
      }
    }
  );

  function gastosPrecargarCorreccion(datos){
    document.getElementById("g_operador").value = datos["OPERADOR"] || "";
    document.getElementById("g_fecha").value  = fechaParaInput(datos["Fecha"]) || document.getElementById("g_fecha").value;
    document.getElementById("g_cat").value    = datos["Categoría"] || "Otros";
    document.getElementById("g_desc").value   = datos["Descripción"] || "";
    setInputMoneda(document.getElementById("g_efec"), datos["Monto Efectivo"] || 0);
    setInputMoneda(document.getElementById("g_transf"), datos["Monto Transferencia"] || 0);
    document.getElementById("g_usd").value    = datos["Monto USD"] || "";
    document.getElementById("g_resp").value   = datos["Responsable"] || "Martin";
    document.getElementById("g_comp").value   = datos["Comprobante"] || "";
    document.getElementById("g_obs").value    = datos["Observaciones"] || "";
    gastosCalcTotal();
    if (_wizardGastos) _wizardGastos.ir(0);
  }

  function gastosCalcTotal(){
    var ef = valorNumerico(document.getElementById("g_efec"));
    var tr = valorNumerico(document.getElementById("g_transf"));
    var us = parseFloat(document.getElementById("g_usd").value) || 0;
    var usPesos = us * _gastosCotizacion;
    var total = ef + tr + usPesos;
    var txt = "Total pagado: " + fmtP(total);
    if (us > 0) txt += " (incluye " + us + " USD ≈ " + fmtP(usPesos) + ")";
    document.getElementById("g_totalDiv").textContent = txt;
    return total;
  }

  function gastosEnviar(){
    var total = gastosCalcTotal();
    var d = {
      fecha: document.getElementById("g_fecha").value,
      cat: document.getElementById("g_cat").value,
      desc: document.getElementById("g_desc").value.trim(),
      montoGasto: 0,
      efec: valorNumerico(document.getElementById("g_efec")),
      transf: valorNumerico(document.getElementById("g_transf")),
      usd: parseFloat(document.getElementById("g_usd").value) || 0,
      resp: document.getElementById("g_resp").value.trim(),
      comp: document.getElementById("g_comp").value.trim(),
      obs: document.getElementById("g_obs").value.trim(),
      operador: document.getElementById("g_operador").value
    };
    if (!d.operador) { mostrarToast("Seleccioná el operador.", "error"); return; }
    if (!d.desc) { mostrarToast("Ingresá una descripción.", "error"); return; }
    if (total <= 0) { mostrarToast("El monto total debe ser > 0.", "error"); return; }

    if (_correccion && _correccion.tipo === "GASTO") { enviarCorreccion("corregirGasto", d); return; }

    llamarBackend("procesarGastoConOperador", d, function(msg){
      mostrarToastOperacion(msg);
      cargarDashboard();
      gastosLimpiarForm();
    });
  }

  /** Deja "Registrar Gasto" en blanco y listo para la próxima carga. Reutilizada tanto tras un gasto normal como tras confirmar una corrección (ver enviarCorreccion() en index.html). */
  function gastosLimpiarForm(){
    limpiarFormulario(document.getElementById("gastos_form"), {
      preservarIds: ["g_operador"],
      fechasHoy: ["g_fecha"],
      despues: gastosCalcTotal
    });
    if (_wizardGastos) _wizardGastos.ir(0);
  }
</script>
